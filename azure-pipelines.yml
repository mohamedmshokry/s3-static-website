# Starter pipeline
# Start with a minimal pipeline that you can customize to build and deploy your code.
# Add steps that build, run tests, deploy, and more:
# https://aka.ms/yaml

trigger:
- main

resources:
  repositories:
  - repository: adoWiki
    type: git
    name: ADO-VMSS/ADO-VMSS.wiki
    ref: refs/heads/wikiMaster

pool:
  name: "Default"

steps:
- checkout: self
  path: s
  persistCredentials: true
  clean: true
  fetchDepth: 0

- checkout: adoWiki
  path: ado-wiki
  persistCredentials: true
  clean: true

- script: echo Hello, world!
  displayName: 'Run a one-line script'

- script: |
    echo Triggered by Github Actions
  displayName: 'Run a multi-line script'

- bash: |
    git fetch origin main
    git checkout -B main origin/main
    git log --pretty=format:"% - %s (%an, %ar)" --reverse > CHANGELOG.md
  displayName: 'Run git command to capture changelog to output'
  workingDirectory: $(Pipeline.Workspace)/s

- bash: |
    set -euo pipefail

    source_dir="$(Pipeline.Workspace)/s"
    wiki_dir="$(Pipeline.Workspace)/ado-wiki"

    cp "${source_dir}/CHANGELOG.md" "${wiki_dir}/CHANGELOG.md"
    cd "${wiki_dir}"

    git config user.email "mohamed.magdysokry@gmail.com"
    git config user.name "mohamedmshokry"
    git add CHANGELOG.md
    git diff --cached --quiet && echo "No wiki changelog changes to commit." && exit 0
    git commit -m "Update changelog for build $(Build.BuildId)"
    git push origin HEAD:wikiMaster
  displayName: "Publish changelog to Azure DevOps Wiki"
