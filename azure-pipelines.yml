# Starter pipeline
# Start with a minimal pipeline that you can customize to build and deploy your code.
# Add steps that build, run tests, deploy, and more:
# https://aka.ms/yaml

trigger:
- main

pool:
  name: "Default"

steps:
- checkout: self
  persistCredentials: true
  clean: true
  fetchDepth: 0

- script: echo Hello, world!
  displayName: 'Run a one-line script'

- script: |
    echo Triggered by Github Actions
  displayName: 'Run a multi-line script'

- bash: |
    git fetch origin main
    git checkout -B main origin/main
    git log --pretty=format:"% - %s (%an, %ar)" --reverse > CHANGELOG.md
  displayName: 'Run git command to capture changelog to output'

- bash: |
    set -euo pipefail

    wiki_dir="${AGENT_TEMPDIRECTORY}/ado-wiki"
    wiki_repo_url="https://mohamedshokryaz01@dev.azure.com/mohamedshokryaz01/ADO-VMSS/_git/ADO-VMSS.wiki"

    rm -rf "${wiki_dir}"
    git -c http.extraheader="AUTHORIZATION: bearer ${SYSTEM_ACCESSTOKEN}" clone "${wiki_repo_url}" "${wiki_dir}"

    cp CHANGELOG.md "${wiki_dir}/CHANGELOG.md"
    cd "${wiki_dir}"

    git config user.email "mohamed.magdysokry@gmail.com"
    git config user.name "mohamedmshokry"
    git add CHANGELOG.md
    git diff --cached --quiet && echo "No wiki changelog changes to commit." && exit 0
    git commit -m "Update changelog for build $(Build.BuildId)"
    git -c http.extraheader="AUTHORIZATION: bearer ${SYSTEM_ACCESSTOKEN}" push origin HEAD:wikiMaster
  displayName: "Publish changelog to Azure DevOps Wiki"
  env:
    SYSTEM_ACCESSTOKEN: $(System.AccessToken)
